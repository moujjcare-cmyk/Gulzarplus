name: Build Gulzar Android APK (MOUJ SYNC v37.0)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-Installed Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare Web Assets & Auto-Verify App Icons
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ ! -f icon-192.png ] && [ -f icon-512.png ]; then
            python3 -c "from PIL import Image; Image.open('icon-512.png').resize((192,192)).save('icon-192.png')" || cp icon-512.png icon-192.png
          fi
          if [ -f icon-192.png ]; then cp icon-192.png www/; fi
          if [ -f icon-512.png ]; then cp icon-512.png www/; fi
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/share@^6.0.0

      - name: Add Android Platform, Sync Capacitor Plugins & Apply Red Rose Icons
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable*/ic_launcher*
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi; do
            if [ -d "$dir" ] && [ -f "icon-192.png" ]; then
              cp icon-192.png "$dir/ic_launcher.png" || true
              cp icon-192.png "$dir/ic_launcher_round.png" || true
              cp icon-192.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          for dir in android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ] && [ -f "icon-512.png" ]; then
              cp icon-512.png "$dir/ic_launcher.png" || true
              cp icon-512.png "$dir/ic_launcher_round.png" || true
              cp icon-512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Gulzar v37.0 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gulzar-Smart-Garden-v37-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
