name: Build Gulzar Android APK (MOUJ SYNC v38.0)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-Installed Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare Web Assets, Install Dependencies & Auto-Verify App Icons
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ ! -f icon-192.png ] && [ -f icon-512.png ]; then
            python3 -c "from PIL import Image; Image.open('icon-512.png').convert('RGBA').resize((192,192), Image.LANCZOS).save('icon-192.png')" || cp icon-512.png icon-192.png
          fi
          if [ -f icon-192.png ]; then cp icon-192.png www/; fi
          if [ -f icon-512.png ]; then cp icon-512.png www/; fi
          if [ -f package.json ]; then
            npm install
          else
            npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0 @capacitor/camera@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/share@^6.0.0
          fi

      - name: Add Android Platform, Inject Required Permissions, Sync Plugins & Resize Red Rose Icons
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # Ensure AndroidManifest.xml declares Camera & Filesystem permissions for native Camera + Documents/Gulzar backup
          python3 - <<'PY'
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  xml = f.read()
              additions = [
                  '    <uses-permission android:name="android.permission.CAMERA" />',
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />',
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />',
              ]
              to_insert = []
              for line in additions:
                  key = line.split('android:name="')[1].split('"')[0]
                  if key not in xml:
                      to_insert.append(line)
              if to_insert and '</manifest>' in xml:
                  xml = xml.replace('</manifest>', '\n'.join(to_insert) + '\n</manifest>', 1)
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(xml)
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              import re
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g = f.read()
              g = re.sub(r'versionCode\s+\d+', 'versionCode 38', g)
              g = re.sub(r'versionName\s+"[^"]*"', 'versionName "3.8.0"', g)
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g)
          PY

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable*/ic_launcher*

          # Generate crisp density-accurate RGBA launcher icons for all Android mipmap buckets
          python3 - <<'PY'
          import os, shutil
          src = 'icon-512.png' if os.path.exists('icon-512.png') else ('icon-192.png' if os.path.exists('icon-192.png') else None)
          if src:
              buckets = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              try:
                  from PIL import Image
                  base = Image.open(src).convert('RGBA')
                  for b, sz in buckets.items():
                      d = os.path.join('android/app/src/main/res', b)
                      if os.path.isdir(d):
                          resized = base.resize((sz, sz), Image.LANCZOS)
                          for fname in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                              resized.save(os.path.join(d, fname), format='PNG')
              except Exception:
                  for b in buckets:
                      d = os.path.join('android/app/src/main/res', b)
                      if os.path.isdir(d):
                          for fname in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                              shutil.copy2(src, os.path.join(d, fname))
          PY

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Gulzar v38.0 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gulzar-Smart-Garden-v38-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
